<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TecTools — Teknik Çalışma Merkezi</title>
  <meta name="description" content="Teknisyenler için teknik araçlar, sistem rehberleri ve iş yönetimi tek çatı altında." />
  <link rel="icon" type="image/png" href="assets/images/brand/tectools-logo-original.png" />
  <link rel="apple-touch-icon" href="assets/images/brand/tectools-logo-original.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0284C7" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/tailwind.css" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/themes.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
  <script>
    try {
      var t = JSON.parse(localStorage.getItem('tectools:theme'));
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* storage unavailable — falls back to system preference */ }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
